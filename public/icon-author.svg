<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 8-bit author avatar: yellow bg, black-outline head with glasses -->
  <rect x="0" y="0" width="24" height="24" fill="#FFC53D"/>
  <!-- head outline -->
  <rect x="5" y="3" width="14" height="3" fill="#0B0B0F"/>
  <rect x="4" y="6" width="16" height="13" fill="#0B0B0F"/>
  <rect x="6" y="19" width="12" height="2" fill="#0B0B0F"/>
  <!-- face skin -->
  <rect x="6" y="6" width="12" height="12" fill="#FFFFFF"/>
  <!-- hair -->
  <rect x="6" y="6" width="12" height="3" fill="#0B0B0F"/>
  <!-- glasses -->
  <rect x="6" y="11" width="5" height="4" fill="#0B0B0F"/>
  <rect x="13" y="11" width="5" height="4" fill="#0B0B0F"/>
  <rect x="11" y="12" width="2" height="2" fill="#0B0B0F"/>
  <!-- lenses -->
  <rect x="7" y="12" width="3" height="2" fill="#FFFFFF"/>
  <rect x="14" y="12" width="3" height="2" fill="#FFFFFF"/>
  <!-- smile -->
  <rect x="10" y="16" width="4" height="1.6" fill="#0B0B0F"/>
</svg>
